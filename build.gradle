plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.1.0'
group = 'dev.sourceform'
base { archivesName = 'minecraft-pedal-control' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
